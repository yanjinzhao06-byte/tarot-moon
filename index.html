/* ---- 声音开关 ---- */
const soundBtn = $("#soundBtn");
function syncSound() {
  const on = Sound.isEnabled();
  soundBtn.classList.toggle("on", on);
  soundBtn.setAttribute("aria-pressed", String(on));
  soundBtn.setAttribute("aria-label", on ? "关闭声音" : "开启声音");
  soundBtn.title = on ? "声音：开" : "声音：关";
}
if (soundBtn) {
  syncSound();
  soundBtn.addEventListener("click", () => {
    Sound.unlock();
    const on = Sound.toggle();
    syncSound();
    if (on) Sound.play("ui");
  });
}
window.addEventListener("pointerdown", () => Sound.unlock(), { once: true });
window.addEventListener("keydown", () => Sound.unlock(), { once: true });

const HKEY = "moon-tarot-history-v1";
function loadHist() { try { return JSON.parse(localStorage.getItem(HKEY) || "[]"); } catch (e) { return []; } }
function saveHist() {
  const rec = { t: Date.now(), q: state.question, s: state.spread.name, cards: state.picks.map(p => p.card.cn + (p.rev ? "(逆)" : "(正)")) };
  const list = loadHist(); list.unshift(rec);
  try { localStorage.setItem(HKEY, JSON.stringify(list.slice(0, 8))); } catch (e) {}
}
function renderHist() {
  const list = loadHist();
  if (!list.length) { histEl.hidden = true; histEl.innerHTML = ""; return; }
  histEl.hidden = false;
  histEl.innerHTML = '<div class="hist-head"><h2>最近的占卜</h2><button class="link-btn" id="clearHist">清空</button></div><ul>' +
    list.map(r => '<li><span class="h-time">' + fmtTime(r.t) + '</span><span class="h-spread">' + esc(r.s) +
      '</span><span class="h-cards">' + esc(r.cards.join(" · ")) + "</span></li>").join("") + "</ul>";
  const cb = $("#clearHist");
  if (cb) cb.addEventListener("click", () => { try { localStorage.removeItem(HKEY); } catch (e) {} renderHist(); });
}

/* =======================================================================
   10. 词典
   ======================================================================= */
const modal = $("#modal"), atlasGrid = $("#atlasGrid"), atlasDetail = $("#atlasDetail");
let atlasBuilt = false, atlasTimer = 0;

function openAtlas() {
  if (!atlasBuilt) {
    atlasGrid.innerHTML = deck.map((c, i) =>
      '<button class="tile" data-i="' + i + '"><span class="t-glyph" style="color:' + c.color + '">' + c.sym +
      '</span><span class="t-name">' + c.cn + "</span></button>").join("");
    atlasBuilt = true;
  }
  clearTimeout(atlasTimer);
  modal.hidden = false;
  document.body.style.overflow = "hidden";
  requestAnimationFrame(() => modal.classList.add("open"));
  setTimeout(() => $("#closeAtlas").focus({ preventScroll: true }), 60);
}
function closeAtlas() {
  modal.classList.remove("open");
  document.body.style.overflow = "";
  atlasTimer = setTimeout(() => { modal.hidden = true; }, reduceMotion ? 0 : 460);
}
atlasGrid.addEventListener("click", e => {
  const t = e.target.closest(".tile");
  if (!t) return;
  $$(".tile.on", atlasGrid).forEach(x => x.classList.remove("on"));
  t.classList.add("on");
  const c = deck[+t.dataset.i];
  atlasDetail.innerHTML = "<h3>" + c.cn + '</h3><div class="ad-en">' + c.en + '</div><div class="ad-kw">' + c.kw +
    '</div><div class="ad-row"><b>正位</b>' + c.up + '</div><div class="ad-row"><b>逆位</b>' + c.rev + "</div>";
});

/* =======================================================================
   11. 星空
   ======================================================================= */
const starfield = (function () {
  const cv = $("#stars"), ctx = cv.getContext("2d");
  let w = 0, h = 0, dpr = 1, stars = [], shoot = null, shootTimer = 8, raf = 0, last = 0;
  let px = 0, py = 0, tpx = 0, tpy = 0, running = false;

  function build() {
    const count = Math.max(48, Math.min(150, Math.round((w * h) / 13000)));
    stars = [];
    for (let i = 0; i < count; i++) {
      const depth = Math.random();
      stars.push({
        x: Math.random() * w, y: Math.random() * h,
        r: .3 + depth * 1.05, a: .16 + Math.random() * .5,
        tw: .22 + Math.random() * .75, ph: Math.random() * Math.PI * 2,
        sp: .18 + (1 - depth) * .55, d: .35 + depth * 1.5, gold: Math.random() > .7
      });
    }
  }
  function resize() {
    dpr = Math.min(2, window.devicePixelRatio || 1);
    w = window.innerWidth; h = window.innerHeight;
    cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
    cv.style.width = w + "px"; cv.style.height = h + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    build();
  }
  function paint(t) {
    const dt = Math.min(60, t - last) / 1000; last = t;
    px += (tpx - px) * .045; py += (tpy - py) * .045;
    ctx.clearRect(0, 0, w, h);
    for (const s of stars) {
      s.ph += dt * s.tw; s.x += dt * s.sp * 2;
      if (s.x > w + 6) { s.x = -6; s.y = Math.random() * h; }
      const a = s.a * (.55 + .45 * Math.sin(s.ph));
      const X = s.x - px * s.d, Y = s.y - py * s.d;
      ctx.beginPath(); ctx.arc(X, Y, s.r, 0, 6.2832);
      ctx.fillStyle = s.gold ? "rgba(228,200,146," + a.toFixed(3) + ")" : "rgba(214,224,248," + (a * .92).toFixed(3) + ")";
      ctx.fill();
      if (s.r > 1.1 && s.gold) {
        ctx.beginPath(); ctx.arc(X, Y, s.r * 2.8, 0, 6.2832);
        ctx.strokeStyle = "rgba(228,200,146," + (a * .16).toFixed(3) + ")";
        ctx.lineWidth = .5; ctx.stroke();
      }
    }
    if (shoot) {
      shoot.t += dt;
      const p = shoot.t / shoot.dur;
      if (p >= 1) shoot = null;
      else {
        const x = shoot.x + shoot.vx * shoot.t, y = shoot.y + shoot.vy * shoot.t;
        const a = Math.sin(p * Math.PI) * .7;
        const g = ctx.createLinearGradient(x, y, x - shoot.vx * .2, y - shoot.vy * .2);
        g.addColorStop(0, "rgba(255,242,214," + a.toFixed(3) + ")"); g.addColorStop(1, "rgba(255,242,214,0)");
        ctx.strokeStyle = g; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x - shoot.vx * .2, y - shoot.vy * .2); ctx.stroke();
      }
    } else if (!reduceMotion) {
      shootTimer -= dt;
      if (shootTimer <= 0) {
        shootTimer = 11 + Math.random() * 16;
        const fromLeft = Math.random() > .5;
        shoot = {
          x: fromLeft ? -40 : w * .85, y: Math.random() * h * .4, t: 0, dur: 1.3,
          vx: (fromLeft ? 1 : -1) * (380 + Math.random() * 240), vy: 110 + Math.random() * 80
        };
      }
    }
    raf = requestAnimationFrame(paint);
  }
  function paintStatic() {
    ctx.clearRect(0, 0, w, h);
    for (const s of stars) {
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, 6.2832);
      ctx.fillStyle = s.gold ? "rgba(228,200,146," + (s.a * .85).toFixed(3) + ")" : "rgba(214,224,248," + (s.a * .8).toFixed(3) + ")";
      ctx.fill();
    }
  }
  function start() {
    if (running) return;
    if (reduceMotion) { paintStatic(); return; }
    running = true; last = performance.now(); raf = requestAnimationFrame(paint);
  }
  function stop() { if (raf) cancelAnimationFrame(raf); raf = 0; running = false; }
  window.addEventListener("resize", () => { resize(); if (reduceMotion) paintStatic(); });
  window.addEventListener("pointermove", e => {
    if (reduceMotion || !canHover) return;
    tpx = (e.clientX / w - .5) * 16; tpy = (e.clientY / h - .5) * 12;
  }, { passive: true });
  document.addEventListener("visibilitychange", () => { if (document.hidden) stop(); else start(); });
  resize();
  return { start, stop, paintStatic };
})();

/* =======================================================================
   12. 装饰月相
   ======================================================================= */
function moonShape(p) {
  const r = 8.6, cx = 12, cy = 12;
  if (p <= .01) return '<circle cx="12" cy="12" r="' + r + '" fill="currentColor" fill-opacity=".07"/>';
  const waxing = p < .5, k = Math.cos(p * Math.PI * 2), rx = Math.abs(k) * r;
  const limb = waxing ? 1 : 0, back = k > 0 ? (waxing ? 0 : 1) : (waxing ? 1 : 0);
  return '<path d="M' + cx + " " + (cy - r) + " A" + r + " " + r + " 0 0 " + limb + " " + cx + " " + (cy + r) +
    " A" + rx.toFixed(2) + " " + r + " 0 0 " + back + " " + cx + " " + (cy - r) + ' Z" fill="currentColor" fill-opacity=".5"/>';
}
function buildMoons() {
  const host = $("#moonPhases");
  if (!host) return;
  host.innerHTML = [0, .13, .25, .37, .5, .63, .75, .87].map((p, i) =>
    '<svg style="--k:' + i + '" viewBox="0 0 24 24" aria-hidden="true">' +
      '<circle cx="12" cy="12" r="8.6" fill="none" stroke="currentColor" stroke-opacity=".35" stroke-width=".7"/>' +
      moonShape(p) + "</svg>").join("");
}

   13. 绑定与启动

$("#brandBtn").addEventListener("click", () => goScene("home"));
$$(".nav-btn[data-scene]").forEach(b => b.addEventListener("click", () => goScene(b.dataset.scene)));
$("#enterBtn").addEventListener("click", () => goScene("ritual"));
$("#navAtlas").addEventListener("click", openAtlas);
$("#atlasBtn").addEventListener("click", openAtlas);
$("#closeAtlas").addEventListener("click", closeAtlas);
modal.addEventListener("click", e => { if (e.target === modal) closeAtlas(); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && !modal.hidden) closeAtlas(); });

drawBtn.addEventListener("click", startDraw);
resetBtn.addEventListener("click", () => {
  if (state.phase === "shuffle" || state.flying) return;
  state.phase = "idle"; state.picks = []; state.fan = [];
  stageEl.innerHTML = ""; fanEl.innerHTML = ""; fanEl.classList.remove("open", "closing"); fanEl.classList.add("empty");
  readingEl.hidden = true; readingEl.innerHTML = "";
  deckEl.classList.remove("done");
  hintEl.textContent = "选好牌阵后点「洗牌」，牌扇展开后由你亲手挑选每一张。";
  syncControls();
});
$("#q").addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); startDraw(); } });
readingEl.addEventListener("click", e => {
  const b = e.target.closest("[data-act]");
  if (!b) return;
  if (b.dataset.act === "again") {
    resetBtn.click();
    window.scrollTo({ top: 0, behavior: reduceMotion ? "auto" : "smooth" });
    setTimeout(() => startDraw(), reduceMotion ? 0 : 420);
  }
});
mMotion.addEventListener("change", e => { reduceMotion = e.matches; starfield.stop(); starfield.start(); });

buildDeck(); buildMoons(); renderSpreads(); renderHist(); syncControls(); starfield.start();
fanEl.classList.add("empty");

</script>
